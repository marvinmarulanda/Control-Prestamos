const KEY="prestamos_app"; // ← key permanente, nunca cambia
const save=async(d)=>{
  try{
    // guardar en storage de Claude Y en localStorage como backup
    try{await window.storage.set(KEY,JSON.stringify(d));}catch(e){}
    try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}
  }catch(e){}
};
const load=async()=>{
  try{
    // 1. Intentar window.storage (Claude)
    try{
      const r=await window.storage.get(KEY);
      if(r&&r.value) return JSON.parse(r.value);
    }catch(e){}
    // 2. Intentar localStorage (Netlify/navegador)
    const r=localStorage.getItem(KEY);
    if(r) return JSON.parse(r);
    // 3. Migrar desde keys viejos
    for(const old of ["prestamos_v6","prestamos_v5","prestamos_v4","prestamos_v3","prestamos_v2"]){
      try{
        const or=await window.storage.get(old);
        if(or&&or.value){const d=JSON.parse(or.value);save(d);return d;}
      }catch(e){}
      try{
        const or=localStorage.getItem(old);
        if(or){const d=JSON.parse(or);save(d);return d;}
      }catch(e){}
    }
    return null;
  }catch{return null;}
};

function genDates(start,pagos,tipo){
  const dates=[];const d=new Date(start+"T12:00:00");
  for(let i=0;i<pagos;i++){
    if(tipo==="semanal")d.setDate(d.getDate()+7);
    else if(tipo==="quincenal")d.setDate(d.getDate()+15);
    else d.setMonth(d.getMonth()+1);
    dates.push(d.toISOString().split("T")[0]);
  }
  return dates;
}

// Genera fechas donde la primera cuota ES firstDate, el resto se calculan desde ahí
function genDatesFromFirst(firstDate,pagos,tipo){
  const dates=[];
  const d=new Date(firstDate+"T12:00:00");
  dates.push(d.toISOString().split("T")[0]); // primera cuota = fecha elegida
  for(let i=1;i<pagos;i++){
    if(tipo==="semanal")d.setDate(d.getDate()+7);
    else if(tipo==="quincenal")d.setDate(d.getDate()+15);
    else d.setMonth(d.getMonth()+1);
    dates.push(d.toISOString().split("T")[0]);
  }
  return dates;
}

function Badge({status}){
  const c=status==="pagada"?"#dcfce7,#16a34a":status==="vencida"?"#fee2e2,#dc2626":"#fef3c7,#d97706";
  const [bg,cl]=c.split(",");
  const label=status==="pagada"?"Pagada":status==="vencida"?"Vencida":"Pendiente";
  return <span style={{background:bg,color:cl,padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700}}>{label}</span>;
}

function LoanCard({loan,clientName,onSelect,onDelete}){
  const paid=loan.installments.filter(i=>i.paid).length;
  const pct=Math.round(paid/loan.pagos*100);
  const isActive=loan.installments.some(i=>!i.paid);
  const next=loan.installments.find(i=>!i.paid);
  const d=next?diffDays(next.dueDate):null;
  return(
    <div style={{...S.card,cursor:"pointer"}} onClick={onSelect}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
        <div>

          <div style={{fontSize:12,color:"#6b7280"}}>{loan.pagos} cuotas {loan.tipo} · {fmt(loan.cuota)}/cuota</div>
        </div>
        <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
          <div style={{display:"inline-block",background:isActive?"#dcfce7":"#e5e7eb",color:isActive?"#16a34a":"#6b7280",padding:"3px 8px",borderRadius:20,fontSize:11,fontWeight:700}}>{isActive?"Activo":"Listo"}</div>
          {d!==null&&<div style={{marginTop:4,background:d<0?"#fee2e2":d<=3?"#fef3c7":"#eff6ff",color:d<0?"#dc2626":d<=3?"#d97706":"#2563eb",padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,textAlign:"center"}}>{d<0?`Venc. ${-d}d`:d===0?"Hoy":`En ${d}d`}</div>}
        </div>
      </div>
      <div style={{height:6,background:"#e5e7eb",borderRadius:3,marginBottom:4}}>
        <div style={{height:"100%",background:"#2563eb",borderRadius:3,width:`${pct}%`,transition:"width 0.3s"}}></div>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#6b7280",marginBottom:6}}>
        <span>{paid}/{loan.pagos} cuotas · {pct}%</span>

      </div>

  );

            <div style={{color:"#9ca3af",fontSize:12,marginTop:2}}>Cliente desde: {fmtD(cli.createdAt)}</div>
            <div style={{display:"flex",gap:8,marginTop:12}}>
              <button onClick={()=>{setEditId(cli.id);setFCli({name:cli.name,phone:cli.phone||""});setModal("edit-client");}} style={{flex:1,padding:"9px",background:"#eff6ff",border:"none",borderRadius:8,color:"#2563eb",fontWeight:700,cursor:"pointer"}}>✏️ Editar</button>
              <button onClick={()=>deleteClient(cli.id)} style={{flex:1,padding:"9px",background:"#fee2e2",border:"none",borderRadius:8,color:"#dc2626",fontWeight:700,cursor:"pointer"}}>🗑 Eliminar</button>
            </div>
          </div>
          <div style={S.card}>
            <h3 style={{margin:"0 0 10px",fontSize:15,fontWeight:700}}>Resumen Financiero</h3>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[["Capital Prestado","#1d4ed8",tP],["Total Cobrado","#16a34a",tCob],["Pendiente","#dc2626",tPend],["Préstamos activos","#374151",actC.length]].map(([lb,cl,v])=>(
                <div key={lb} style={{background:"#f9fafb",borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontWeight:800,color:cl,fontSize:typeof v==="number"&&v>999999?12:15}}>{lb==="Préstamos activos"?v:fmt(v)}</div>
                  <div style={{fontSize:11,color:"#6b7280"}}>{lb}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <h3 style={{margin:0,fontSize:15,fontWeight:700}}>Préstamos ({cLoans.length})</h3>
            <button onClick={()=>{setFLoan({clientId:cli.id,modId:"",startDate:todayStr(),nota:""});setModal("new-loan");}} style={{background:"#2563eb",color:"#fff",border:"none",borderRadius:8,padding:"6px 14px",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ Nuevo</button>
          </div>
          {cLoans.map(l=><LoanCard key={l.id} loan={l} onSelect={()=>setDetail({type:"loan",id:l.id})} />)}
        </div>
        {modal==="edit-client"&&<Modal title="Editar Cliente" onClose={()=>setModal(null)}>
          <label style={S.lbl}>Nombre completo *</label>
          <input style={S.inp} value={fCli.name} onChange={e=>setFCli(p=>({...p,name:e.target.value}))}/>
          <label style={S.lbl}>Teléfono</label>
          <input style={S.inp} value={fCli.phone} onChange={e=>setFCli(p=>({...p,phone:e.target.value}))}/>
          <button style={S.btnP} onClick={updateClient}>Guardar Cambios</button>
          <button style={S.btnS} onClick={()=>setModal(null)}>Cancelar</button>
        </Modal>}
        {modal==="new-loan"&&<LoanModal fLoan={fLoan} setFLoan={setFLoan} clients={clients} onAdd={addLoan} onClose={()=>setModal(null)}/>}
      </div>
    );
  }

  // ─── MAIN LAYOUT ────────────────────────────────────────────────────────────
  const NavTab=({t,ic,lb})=>(
    <button onClick={()=>{setTab(t);setSearch("");}} style={{flex:1,padding:"8px 2px",border:"none",background:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
      <span style={{fontSize:20}}>{ic}</span>
      <span style={{fontSize:10,fontWeight:700,color:tab===t?"#2563eb":"#6b7280"}}>{lb}</span>
    </button>
  );

  return(
    <div style={{maxWidth:440,margin:"0 auto",minHeight:"100vh",background:"#f4f6fb",fontFamily:"system-ui,sans-serif",position:"relative",overflowX:"hidden"}}>

      <div style={{background:"#2563eb",padding:"env(safe-area-inset-top, 14px) 20px 12px",paddingTop:"calc(env(safe-area-inset-top, 0px) + 14px)",position:"sticky",top:0,zIndex:100}}>
        <h1 style={{color:"#fff",fontWeight:700,fontSize:18,margin:0,textAlign:"center"}}>
          {tab==="home"?"Inicio":tab==="clients"?"Clientes":tab==="loans"?"Préstamos":tab==="calendar"?"Calendario":"Reportes"}
        </h1>
      </div>

      <div style={{paddingBottom:"calc(env(safe-area-inset-bottom, 0px) + 80px)"}}>
        {tab==="home"&&(
          <div style={{padding:"12px 14px"}}>
            {/* Greeting */}
            <div style={{...S.card,background:"linear-gradient(135deg,#2563eb,#1d4ed8)",marginBottom:10}}>
              <div style={{color:"#fff"}}>
                <div style={{fontWeight:700,fontSize:19,marginBottom:2}}>{greet()} 👋</div>
                <div style={{fontSize:13,opacity:0.8}}>Gestor de Préstamos Personales</div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:14}}>
                {[[clients.length,"👥","Clientes"],[activeLoans.length,"💰","Activos"],[pct+"%","📈","Recuperado"]].map(([v,ic,lb])=>(
                  <div key={lb} style={{background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
                    <div style={{fontSize:16}}>{ic}</div>
                    <div style={{color:"#fff",fontWeight:800,fontSize:18}}>{v}</div>
                    <div style={{color:"rgba(255,255,255,0.75)",fontSize:10}}>{lb}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Caja */}
            <CajaCard caja={caja} setCaja={setCaja} toast2={toast2} />

            {/* Alerts */}
            {(overdueList.length>0||ultimaCuotaLoans.length>0)&&(
              <div style={S.card}>
                <h3 style={{margin:"0 0 10px",fontSize:15,fontWeight:700}}>🔔 Alertas Importantes</h3>
                {overdueList.length>0&&<div style={{background:"#fee2e2",borderRadius:8,padding:"10px 12px",marginBottom:8}}><div style={{color:"#dc2626",fontWeight:700,fontSize:13}}>⚠️ {overdueList.length} cuota{overdueList.length!==1?"s":""} vencida{overdueList.length!==1?"s":""}</div><div style={{color:"#dc2626",fontSize:12}}>Revisá el calendario para ver los detalles</div></div>}
                {ultimaCuotaLoans.length>0&&(
                  <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"10px 12px"}}>
                    <div style={{color:"#16a34a",fontWeight:700,fontSize:13,marginBottom:6}}>✅ Préstamos por finalizar — falta 1 cuota</div>
                    {ultimaCuotaLoans.map(({loan,clientName})=>(
                      <div key={loan.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderTop:"1px solid #dcfce7"}}>
                        <div>
                          <span style={{fontWeight:700,fontSize:13,color:"#15803d"}}>{clientName}</span>
                          <span style={{fontSize:12,color:"#6b7280",marginLeft:6}}>Préstamo {fmt(loan.monto)}</span>
                        </div>
                        <span style={{fontWeight:800,color:"#16a34a",fontSize:13}}>{fmt(loan.cuota)}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ─── CALCULADORA RÁPIDA ─────────────────────────────────── */}
            <CalcRapida />

            {/* ─── BILLETERA ─────────────────────────────────────── */}
            {billetera && <BilleteraCard
              billetera={billetera}
              updBilletera={updBilletera}
              caja={caja}
              setCaja={setCaja}
              activeLoans={activeLoans}
              toast2={toast2}
            />}

            {/* Financial summary */}
            <div style={S.card}>
              <h3 style={{margin:"0 0 10px",fontSize:15,fontWeight:700}}>💰 Resumen Financiero</h3>
              {[["📦","#1d4ed8",totalCap,"Capital Prestado"],["✅","#16a34a",totalPaid,"Total Cobrado"],["⏳","#d97706",totalPend,"Por Cobrar"],["🔥","#7c3aed",totalSem,"Ganancia Semanal"]].map(([ic,cl,v,lb])=>(
                <div key={lb} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #f3f4f6"}}>
                  <div style={{width:36,height:36,borderRadius:"50%",background:cl+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{ic}</div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:800,color:cl,fontSize:16}}>{fmt(v)}</div>
                    <div style={{fontSize:11,color:"#6b7280"}}>{lb}</div>
                  </div>
                </div>
              ))}
            </div>



            {/* Quick actions */}
            <div style={S.card}>
              <h3 style={{margin:"0 0 10px",fontSize:15,fontWeight:700}}>⚡ Acciones Rápidas</h3>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                {[["🧑","Nuevo Cliente","#16a34a",()=>{setFCli({name:"",phone:""});setModal("new-client");}],["💰","Nuevo Préstamo","#2563eb",()=>{setFLoan({clientId:"",modId:"",startDate:todayStr(),firstPayDate:"",nota:"",esManual:false,manualMonto:"",manualCuota:"",manualPagos:"",manualTipo:"quincenal"});setModal("new-loan");}],["📅","Calendario","#d97706",()=>setTab("calendar")],["📊","Reportes","#7c3aed",()=>setTab("reports")]].map(([ic,lb,cl,fn])=>(
                  <button key={lb} onClick={fn} style={{padding:"16px 8px",background:"#fff",border:`2px solid ${cl}`,borderRadius:12,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
                    <span style={{fontSize:28}}>{ic}</span>
                    <span style={{fontSize:12,fontWeight:700,color:cl}}>{lb}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        {tab==="clients"&&(
          <div style={{padding:"12px 14px"}}>
            <div style={{...S.card,background:"#eff6ff",border:"1px solid #bfdbfe"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontWeight:700,fontSize:15}}>👥 Clientes <span style={{color:"#2563eb"}}>{clients.length}/30</span></div>
              </div>
              <div style={{height:6,background:"#dbeafe",borderRadius:3,marginTop:8}}><div style={{height:"100%",background:"#2563eb",borderRadius:3,width:`${clients.length/30*100}%`}}></div></div>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <input style={{...S.inp,flex:1}} placeholder="Buscar clientes..." value={search} onChange={e=>setSearch(e.target.value)}/>
              <button onClick={()=>{setFCli({name:"",phone:""});setModal("new-client");}} style={{background:"#2563eb",color:"#fff",border:"none",borderRadius:8,padding:"0 14px",fontWeight:700,cursor:"pointer",fontSize:13,whiteSpace:"nowrap"}}>+ Nuevo</button>
            </div>
            {clients.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())).map(c=>{
              const cl2=loans.filter(l=>l.clientId===c.id);
              const act2=cl2.filter(l=>l.installments.some(i=>!i.paid)).length;
              const tot2=cl2.reduce((s,l)=>s+l.monto,0);
              return(
                <div key={c.id} style={{...S.card,cursor:"pointer"}} onClick={()=>setDetail({type:"client",id:c.id})}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div>
                      <div style={{fontWeight:700,fontSize:16}}>{c.name}</div>
                      {c.phone&&<div style={{fontSize:13,color:"#6b7280"}}>📞 {c.phone}</div>}
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontWeight:700,color:"#1d4ed8",fontSize:15}}>{fmt(tot2)}</div>
                      <span style={{background:"#eff6ff",color:"#2563eb",padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700}}>{act2} préstamo{act2!==1?"s":""}</span>
                    </div>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,paddingTop:8,borderTop:"1px solid #f3f4f6"}}>
                    <div style={{fontSize:11,color:"#9ca3af"}}>Desde {fmtD(c.createdAt)}</div>
                    <button onClick={e=>{e.stopPropagation();deleteClient(c.id);}} style={{color:"#dc2626",background:"none",border:"none",cursor:"pointer",fontSize:12,fontWeight:600}}>🗑 Eliminar</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {tab==="loans"&&(
          <div style={{padding:"12px 14px"}}>
            <div style={{...S.card,background:"#eff6ff",border:"1px solid #bfdbfe"}}>
              <div style={{fontWeight:700,fontSize:15}}>💰 Préstamos <span style={{color:"#2563eb"}}>{activeLoans.length+completedLoans.length}/30</span></div>
              <div style={{height:6,background:"#dbeafe",borderRadius:3,marginTop:8}}><div style={{height:"100%",background:"#2563eb",borderRadius:3,width:`${Math.min((activeLoans.length+completedLoans.length)/30,1)*100}%`}}></div></div>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <input style={{...S.inp,flex:1}} placeholder="Buscar por cliente..." value={search} onChange={e=>setSearch(e.target.value)}/>
              <button onClick={()=>{setFLoan({clientId:"",modId:"",startDate:todayStr(),firstPayDate:"",nota:"",esManual:false,manualMonto:"",manualCuota:"",manualPagos:"",manualTipo:"quincenal"});setModal("new-loan");}} style={{background:"#2563eb",color:"#fff",border:"none",borderRadius:8,padding:"0 14px",fontWeight:700,cursor:"pointer",fontSize:13,whiteSpace:"nowrap"}}>+ Nuevo</button>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              {[["Activos",false],[`Completados`,true]].map(([lb,v])=>(
                <button key={lb} onClick={()=>setShowCompleted(v)} style={{flex:1,padding:"8px",borderRadius:20,border:"none",fontWeight:700,fontSize:13,cursor:"pointer",background:showCompleted===v?"#2563eb":"#e5e7eb",color:showCompleted===v?"#fff":"#374151"}}>{lb} ({v?completedLoans.length:activeLoans.length})</button>
              ))}
            </div>
            {(showCompleted?completedLoans:activeLoans).filter(l=>{const c=clients.find(cl=>cl.id===l.clientId);return(c?.name||"").toLowerCase().includes(search.toLowerCase());}).map(l=>(
              <LoanCard key={l.id} loan={l} clientName={clients.find(c=>c.id===l.clientId)?.name} onSelect={()=>setDetail({type:"loan",id:l.id})} onDelete={()=>deleteLoan(l.id)}/>
            ))}
          </div>
        )}

        {tab==="calendar"&&<CalView allInst={allInst} calFilter={calFilter} setCalFilter={setCalFilter} calView={calView} setCalView={setCalView} calDate={calDate} setCalDate={setCalDate} onToggle={toggleInst}/>}

        {tab==="reports"&&(
          <div style={{padding:"12px 14px"}}>
            <div style={S.card}>
              <h3 style={{margin:"0 0 12px",fontSize:15,fontWeight:700}}>💰 Resumen Financiero</h3>
              {[["Capital prestado activo",totalCap,"#1d4ed8"],["Total cobrado",totalPaid,"#16a34a"],["Por cobrar",totalPend,"#dc2626"],["Ganancia semanal total",totalSem,"#7c3aed"],["Ganancia estimada (activos)",activeLoans.reduce((s,l)=>s+l.ganancia,0),"#d97706"]].map(([lb,v,cl])=>(
                <div key={lb} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #f3f4f6"}}>
                  <span style={{fontSize:13,color:"#6b7280"}}>{lb}</span>
                  <span style={{fontWeight:800,color:cl}}>{fmt(v)}</span>
                </div>
              ))}
            </div>

            <div style={S.card}>
              <h3 style={{margin:"0 0 10px",fontSize:15,fontWeight:700}}>📊 Clientes y Préstamos</h3>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                <div style={{background:"#f9fafb",borderRadius:8,padding:10}}>
                  <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>Clientes</div>
                  <div style={{fontSize:12,color:"#6b7280"}}>Total: <b style={{color:"#374151"}}>{clients.length}</b></div>
                </div>
                <div style={{background:"#f9fafb",borderRadius:8,padding:10}}>
                  <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>Préstamos</div>
                  <div style={{fontSize:12,color:"#16a34a"}}>Activos: <b>{activeLoans.length}</b></div>
                  <div style={{fontSize:12,color:"#6b7280"}}>Listos: <b>{completedLoans.length}</b></div>
                </div>
                <div style={{background:"#f9fafb",borderRadius:8,padding:10}}>
                  <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>Cuotas</div>
                  <div style={{fontSize:12,color:"#16a34a"}}>Pagadas: <b>{loans.reduce((s,l)=>s+l.installments.filter(i=>i.paid).length,0)}</b></div>
                  <div style={{fontSize:12,color:"#d97706"}}>Pend: <b>{loans.reduce((s,l)=>s+l.installments.filter(i=>!i.paid).length,0)}</b></div>
                </div>
              </div>
            </div>

            <div style={S.card}>
              <h3 style={{margin:"0 0 10px",fontSize:15,fontWeight:700}}>📈 Ganancia Semanal por Préstamo</h3>
              <div style={{background:"#eff6ff",borderRadius:8,padding:"10px 14px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontWeight:700,color:"#1d4ed8",fontSize:14}}>TOTAL SEMANAL</span>
                <span style={{fontWeight:800,color:"#1d4ed8",fontSize:18}}>{fmt(totalSem)}</span>
              </div>
              {[...activeLoans].sort((a,b)=>b.semanal-a.semanal).map((l,i)=>{
                const c=clients.find(cl=>cl.id===l.clientId);
                return(
                  <div key={l.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #f3f4f6"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{width:22,height:22,borderRadius:"50%",background:"#eff6ff",color:"#2563eb",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</div>
                      <div>
                        <div style={{fontWeight:700,fontSize:13}}>{c?.name||"?"}</div>
                        <div style={{fontSize:11,color:"#6b7280"}}>{fmt(l.monto)} · {l.pagos} cuotas {l.tipo}</div>
                      </div>
                    </div>
                    <span style={{fontWeight:800,color:"#16a34a",fontSize:14,flexShrink:0,marginLeft:8}}>{fmt(l.semanal)}</span>
                  </div>
                );
              })}
            </div>

            <div style={{...S.card,marginBottom:20}}>
              <h3 style={{margin:"0 0 10px",fontSize:15,fontWeight:700}}>🏆 Top Clientes por Monto</h3>
              {clients.map(c=>{const t=loans.filter(l=>l.clientId===c.id).reduce((s,l)=>s+l.monto,0);return{...c,t};}).filter(c=>c.t>0).sort((a,b)=>b.t-a.t).slice(0,8).map((c,i)=>(
                <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #f3f4f6"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:28,height:28,borderRadius:"50%",background:i<3?"#fbbf24":"#e5e7eb",color:i<3?"#fff":"#374151",fontSize:12,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}}>#{i+1}</div>
                    <div style={{fontWeight:700}}>{c.name}</div>
                  </div>
                  <div style={{fontWeight:700,color:"#1d4ed8"}}>{fmt(c.t)}</div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:440,background:"#fff",borderTop:"1px solid #e5e7eb",display:"flex",zIndex:100,paddingBottom:"env(safe-area-inset-bottom, 0px)"}}>
        {[["home","🏠","Inicio"],["clients","👥","Clientes"],["loans","💰","Préstamos"],["calendar","📅","Calendario"],["reports","📊","Reportes"]].map(([t,ic,lb])=>(
          <NavTab key={t} t={t} ic={ic} lb={lb}/>
        ))}
      </div>

      {confirm&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',zIndex:9998,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
          <div style={{background:'#fff',borderRadius:16,padding:24,width:'100%',maxWidth:340,boxShadow:'0 8px 30px rgba(0,0,0,0.2)'}}>
            <div style={{fontSize:32,textAlign:'center',marginBottom:12}}>🗑</div>
            <div style={{fontWeight:700,fontSize:16,textAlign:'center',marginBottom:8,color:'#111'}}>Confirmar eliminación</div>
            <div style={{fontSize:14,color:'#6b7280',textAlign:'center',marginBottom:20}}>{confirm.msg}</div>
            <div style={{display:'flex',gap:10}}>
              <button onClick={()=>setConfirm(null)} style={{flex:1,padding:12,borderRadius:10,border:'2px solid #d1d5db',background:'#fff',fontWeight:700,fontSize:14,cursor:'pointer',color:'#374151'}}>Cancelar</button>
              <button onClick={()=>{confirm.onOk();setConfirm(null);}} style={{flex:1,padding:12,borderRadius:10,border:'none',background:'#dc2626',fontWeight:700,fontSize:14,cursor:'pointer',color:'#fff'}}>Eliminar</button>
            </div>
          </div>
        </div>
      )}
      {modal==="new-client"&&<Modal title="Nuevo Cliente" onClose={()=>setModal(null)}>
        <label style={S.lbl}>Nombre completo *</label>
        <input style={S.inp} placeholder="Ej: Juan Pérez" value={fCli.name} onChange={e=>setFCli(p=>({...p,name:e.target.value}))}/>
        <label style={S.lbl}>Teléfono</label>
        <input style={S.inp} placeholder="Ej: 300 123 4567" value={fCli.phone} onChange={e=>setFCli(p=>({...p,phone:e.target.value}))}/>
        <button style={S.btnP} onClick={addClient}>Crear Cliente</button>
        <button style={S.btnS} onClick={()=>setModal(null)}>Cancelar</button>
      </Modal>}

      {modal==="new-loan"&&<LoanModal fLoan={fLoan} setFLoan={setFLoan} clients={clients} onAdd={addLoan} onClose={()=>setModal(null)}/>}


    </div>
  );
}

function LoanModal({fLoan,setFLoan,clients,onAdd,onClose}){
  const mod=MODS.find(m=>m.id===fLoan.modId);
  const manualGanancia=fLoan.manualMonto&&fLoan.manualCuota&&fLoan.manualPagos
    ?(Number(fLoan.manualCuota)*Number(fLoan.manualPagos))-Number(fLoan.manualMonto):null;
  return(
    <Modal title="Nuevo Préstamo" onClose={onClose}>
      <label style={S.lbl}>Cliente *</label>
      <select style={S.inp} value={fLoan.clientId} onChange={e=>setFLoan(p=>({...p,clientId:e.target.value}))}>
        <option value="">Seleccioná un cliente...</option>
        {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
      </select>

      {/* Toggle modalidad / manual */}
      <div style={{display:"flex",gap:8,marginTop:12,marginBottom:2}}>
        {[["📋 Modalidad del listado",false],["✏️ Préstamo especial",true]].map(([lb,v])=>(
          <button key={String(v)} onClick={()=>setFLoan(p=>({...p,esManual:v,modId:""}))}
            style={{flex:1,padding:"9px 4px",borderRadius:8,border:`2px solid ${fLoan.esManual===v?"#2563eb":"#e5e7eb"}`,
              background:fLoan.esManual===v?"#eff6ff":"#fff",
              color:fLoan.esManual===v?"#2563eb":"#6b7280",fontWeight:700,fontSize:12,cursor:"pointer"}}>
            {lb}
          </button>
        ))}
      </div>

      {!fLoan.esManual ? (
        <>
          <label style={S.lbl}>Modalidad *</label>
          <select style={S.inp} value={fLoan.modId} onChange={e=>setFLoan(p=>({...p,modId:e.target.value}))}>
            <option value="">Seleccioná modalidad...</option>
            {MONTOS_UNICOS.map(monto=>(
              <optgroup key={monto} label={`── $ ${(monto/1000).toLocaleString("es-CO")}.000 ──`}>
                {modsDeMontos(monto).map(m=><option key={m.id} value={m.id}>{m.label}</option>)}
              </optgroup>
            ))}
          </select>
          {mod&&(
            <div style={{background:"#eff6ff",borderRadius:10,padding:"12px 14px",marginTop:8,border:"1px solid #bfdbfe"}}>
              <div style={{fontWeight:700,fontSize:13,color:"#1d4ed8",marginBottom:8}}>Vista previa</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                {[["Monto",fmt(mod.monto),"#374151"],["Cuota ("+mod.tipo+")",fmt(mod.cuota),"#1d4ed8"],["Ganancia total",fmt(mod.ganancia),"#16a34a"],["Gan. semanal",fmt(mod.semanal),"#16a34a"]].map(([lb,v,cl])=>(
                  <div key={lb}><div style={{fontSize:10,color:"#6b7280"}}>{lb}</div><div style={{fontWeight:800,color:cl,fontSize:13}}>{v}</div></div>
                ))}
              </div>
            </div>
          )}
        </>
      ) : (
        <>
          <div style={{background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:10,padding:"10px 12px",marginTop:4,fontSize:12,color:"#c2410c"}}>
            Ingresá los valores manualmente para este préstamo especial
          </div>
          <label style={S.lbl}>Monto prestado *</label>
          <input type="number" style={S.inp} placeholder="Ej: 800000" value={fLoan.manualMonto}
            onChange={e=>setFLoan(p=>({...p,manualMonto:e.target.value}))}/>
          <label style={S.lbl}>Cuota por pago *</label>
          <input type="number" style={S.inp} placeholder="Ej: 150000" value={fLoan.manualCuota}
            onChange={e=>setFLoan(p=>({...p,manualCuota:e.target.value}))}/>
          <label style={S.lbl}>Número de cuotas *</label>
          <input type="number" style={S.inp} placeholder="Ej: 6" value={fLoan.manualPagos}
            onChange={e=>setFLoan(p=>({...p,manualPagos:e.target.value}))}/>
          <label style={S.lbl}>Tipo de cuota *</label>
          <select style={S.inp} value={fLoan.manualTipo} onChange={e=>setFLoan(p=>({...p,manualTipo:e.target.value}))}>
            <option value="semanal">Semanal (cada 7 días)</option>
            <option value="quincenal">Quincenal (cada 15 días)</option>
            <option value="mensual">Mensual (cada mes)</option>
          </select>
          {manualGanancia!==null&&(
            <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:10,padding:"12px 14px",marginTop:8}}>
              <div style={{fontWeight:700,fontSize:13,color:"#16a34a",marginBottom:8}}>Vista previa</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                {[["Total a cobrar",fmt(Number(fLoan.manualCuota)*Number(fLoan.manualPagos)),"#374151"],
                  ["Ganancia estimada",fmt(manualGanancia),"#16a34a"]].map(([lb,v,cl])=>(
                  <div key={lb}><div style={{fontSize:10,color:"#6b7280"}}>{lb}</div><div style={{fontWeight:800,color:cl,fontSize:13}}>{v}</div></div>
                ))}
              </div>
            </div>
          )}
        </>
      )}

      <label style={S.lbl}>📅 Fecha del préstamo *</label>
      <input type="date" style={S.inp} value={fLoan.startDate} onChange={e=>setFLoan(p=>({...p,startDate:e.target.value}))}/>
      <label style={S.lbl}>💳 Fecha del primer pago *</label>
      <div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>Las siguientes cuotas se calculan desde esta fecha en adelante</div>
      <input type="date" style={{...S.inp,borderColor:"#16a34a"}} value={fLoan.firstPayDate} onChange={e=>setFLoan(p=>({...p,firstPayDate:e.target.value}))}/>
      {fLoan.firstPayDate&&fLoan.startDate&&fLoan.firstPayDate!==fLoan.startDate&&(
        <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"7px 10px",marginTop:4,fontSize:12,color:"#16a34a"}}>
          ✓ Préstamo el {fmtD(fLoan.startDate)} · Primer pago el {fmtD(fLoan.firstPayDate)}
        </div>
      )}
      <label style={S.lbl}>Notas adicionales</label>
      <textarea style={{...S.inp,height:60,resize:"none"}} placeholder="Info adicional..." value={fLoan.nota} onChange={e=>setFLoan(p=>({...p,nota:e.target.value}))}/>
      <button style={S.btnP} onClick={onAdd}>Crear Préstamo</button>
      <button style={S.btnS} onClick={onClose}>Cancelar</button>
    </Modal>
  );
}

function CalView({allInst,calFilter,setCalFilter,calView,setCalView,calDate,setCalDate,onToggle}){
  const filtered=allInst.filter(i=>calFilter==="todos"?true:i.status===calFilter);
  const monthInsts=filtered.filter(i=>{const[y,m]=i.dueDate.split("-");return parseInt(y)===calDate.year&&parseInt(m)-1===calDate.month;});
  const week7=filtered.filter(i=>{const d=diffDays(i.dueDate);return d>=0&&d<=7;});
  const showList=calView==="mes"?monthInsts:week7;
  const totalCobrar=showList.filter(i=>!i.paid).reduce((s,i)=>s+i.cuota,0);

  const firstDay=new Date(calDate.year,calDate.month,1).getDay();
  const daysInMonth=new Date(calDate.year,calDate.month+1,0).getDate();
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const byDay={};
  monthInsts.forEach(i=>{const d=parseInt(i.dueDate.split("-")[2]);if(!byDay[d])byDay[d]=[];byDay[d].push(i);});

  return(
    <div style={{padding:"12px 14px"}}>
      <div style={S.card}>
        <h3 style={{margin:"0 0 10px",fontSize:15,fontWeight:700}}>Resumen del Período</h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:10}}>
          {[[allInst.length,"Total","#374151"],[allInst.filter(i=>i.status==="vencida").length,"Vencidas","#dc2626"],[allInst.filter(i=>i.status==="pendiente").length,"Pendientes","#d97706"],[allInst.filter(i=>i.status==="pagada").length,"Pagadas","#16a34a"]].map(([v,lb,cl])=>(
            <div key={lb} style={{textAlign:"center"}}>
              <div style={{fontWeight:800,color:cl,fontSize:18}}>{v}</div>
              <div style={{fontSize:10,color:"#6b7280"}}>{lb}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",background:"#f9fafb",borderRadius:8,padding:"8px 12px"}}>
          <span style={{fontSize:13,color:"#6b7280"}}>Por cobrar ({calView==="mes"?"mes":"7d"})</span>
          <span style={{fontWeight:800,color:"#1d4ed8"}}>{fmt(totalCobrar)}</span>
        </div>
      </div>

      <div style={S.card}>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          {[["mes","📅 Mes"],["7dias","⏰ Próximos 7d"]].map(([v,lb])=>(
            <button key={v} onClick={()=>setCalView(v)} style={{flex:1,padding:"8px",borderRadius:20,border:"none",fontWeight:700,fontSize:13,cursor:"pointer",background:calView===v?"#2563eb":"#e5e7eb",color:calView===v?"#fff":"#374151"}}>{lb}</button>
          ))}
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {[["todos","Todos"],["pendiente","Pendientes"],["vencida","Vencidas"],["pagada","Pagadas"]].map(([v,lb])=>(
            <button key={v} onClick={()=>setCalFilter(v)} style={{padding:"5px 12px",borderRadius:20,border:"none",fontWeight:600,fontSize:12,cursor:"pointer",background:calFilter===v?"#2563eb":"#e5e7eb",color:calFilter===v?"#fff":"#374151"}}>{lb}</button>
          ))}
        </div>
      </div>

      {calView==="mes"&&(
        <div style={S.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <button onClick={()=>{const d=new Date(calDate.year,calDate.month-1,1);setCalDate({year:d.getFullYear(),month:d.getMonth()});}} style={{background:"#e5e7eb",border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontWeight:700}}>◀</button>
            <div style={{fontWeight:700,fontSize:15}}>{monthName(calDate.month)} {calDate.year}</div>
            <button onClick={()=>{const d=new Date(calDate.year,calDate.month+1,1);setCalDate({year:d.getFullYear(),month:d.getMonth()});}} style={{background:"#e5e7eb",border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontWeight:700}}>▶</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1,marginBottom:6}}>
            {["D","L","M","M","J","V","S"].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#9ca3af",padding:"4px 0"}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1}}>
            {cells.map((day,i)=>{
              if(!day)return<div key={i}/>;
              const dInst=byDay[day]||[];
              const hV=dInst.some(i=>i.status==="vencida"),hP=dInst.some(i=>!i.paid&&!hV),hO=dInst.length>0&&dInst.every(i=>i.paid);
              const isToday=`${calDate.year}-${String(calDate.month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`===todayStr();
              return(
                <div key={day} style={{textAlign:"center",padding:"3px 1px",borderRadius:6,border:isToday?"2px solid #2563eb":"2px solid transparent",minHeight:34}}>
                  <div style={{fontSize:12,fontWeight:isToday?700:400,color:isToday?"#1d4ed8":"#374151"}}>{day}</div>
                  {dInst.length>0&&<div style={{width:18,height:18,borderRadius:"50%",background:hV?"#dc2626":hP?"#f59e0b":hO?"#16a34a":"#e5e7eb",color:"#fff",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",margin:"1px auto 0"}}>{dInst.length}</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div style={S.card}>
        <h3 style={{margin:"0 0 10px",fontSize:15,fontWeight:700}}>{calView==="mes"?`${monthName(calDate.month)} ${calDate.year}`:"Próximos 7 días"} · {showList.length} cuotas</h3>
        {showList.length===0&&<div style={{textAlign:"center",color:"#9ca3af",padding:24}}>No hay cuotas para mostrar</div>}
        {showList.sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).map(inst=>{
          const d=diffDays(inst.dueDate);
          return(
            <div key={inst.loanId+inst.id} style={{padding:"10px 0",borderBottom:"1px solid #f3f4f6"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14}}>Cuota {inst.num}/{inst.pagos} · {inst.clientName}</div>
                  <div style={{fontWeight:800,color:"#1d4ed8",fontSize:15}}>{fmt(inst.cuota)}</div>
                  <div style={{fontSize:12,color:"#6b7280"}}>Vence: {fmtD(inst.dueDate)}{!inst.paid&&<span style={{color:d<0?"#dc2626":d<=3?"#d97706":"#16a34a",marginLeft:6,fontWeight:600}}>{d<0?`hace ${-d}d`:d===0?"hoy":`en ${d}d`}</span>}</div>
                </div>
                <Badge status={inst.status}/>
              </div>
              {!inst.paid?(
                <button onClick={()=>onToggle(inst.loanId,inst.id)} style={{background:"#16a34a",color:"#fff",border:"none",borderRadius:8,padding:"8px 14px",fontSize:13,fontWeight:700,cursor:"pointer"}}>💳 Marcar Pagada</button>
              ):(
                <button onClick={()=>onToggle(inst.loanId,inst.id)} style={{background:"#f3f4f6",color:"#6b7280",border:"none",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:600,cursor:"pointer"}}>↩ Deshacer</button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── BILLETERA CARD ──────────────────────────────────────────────────────────
function BilleteraCard({ billetera, updBilletera, caja, setCaja, activeLoans, toast2 }) {
  const [open, setOpen]         = useState(false);
  const [editItem, setEditItem] = useState(null);   // {grupoId, itemId}
  const [editVal, setEditVal]   = useState("");
  const [editConc, setEditConc] = useState("");
  const [editNota, setEditNota] = useState("");
  const [newItem, setNewItem]   = useState(null);   // grupoId
  const [niMonto, setNiMonto]   = useState("");
  const [niConc, setNiConc]     = useState("");
  const [niNota, setNiNota]     = useState("");
  const [newGrupo, setNewGrupo] = useState(false);
  const [ngNombre, setNgNombre] = useState("");
  const [ngTipo, setNgTipo]     = useState("compartido");

  const [editInv, setEditInv]   = useState(false);
  const [invVal, setInvVal]     = useState("");

  const F = (n) => "$ " + Math.round(n||0).toLocaleString("es-CO");

  const gananciaTotal  = (billetera.gananciaHistorica||0) + (billetera.gananciaApp||0);
  const totalConInv    = gananciaTotal + (billetera.invertido||0);

  // Extraído por tipo de grupo
  const extraidoMarvin    = billetera.grupos.filter(g=>g.tipo==="marvin").reduce((s,g)=>s+g.items.reduce((ss,i)=>ss+i.monto,0),0);
  const extraidoPaola     = billetera.grupos.filter(g=>g.tipo==="paola").reduce((s,g)=>s+g.items.reduce((ss,i)=>ss+i.monto,0),0);
  const extraidoCompartido= billetera.grupos.filter(g=>g.tipo==="compartido").reduce((s,g)=>s+g.items.reduce((ss,i)=>ss+i.monto,0),0);
  const totalExtraido     = extraidoMarvin + extraidoPaola + extraidoCompartido;

  // Cálculo automático de ganancias por socio
  const mitad          = gananciaTotal / 2;
  const gananciaMarvin = mitad - extraidoMarvin - extraidoCompartido / 2;
  const gananciaPoala  = mitad - extraidoPaola  - extraidoCompartido / 2;

  const totalGeneral   = (billetera.invertido||0) + gananciaMarvin + gananciaPoala;
  const totalPrestados = activeLoans.reduce((s,l)=>s+l.monto,0);

  // ── helpers ──────────────────────────────────────────────────────────────
  const saveItem = (grupoId, itemId) => {
    const monto = Number(editVal);
    if (!monto && monto !== 0) return;
    const oldMonto = billetera.grupos.find(g=>g.id===grupoId)?.items.find(i=>i.id===itemId)?.monto||0;
    const diff = monto - oldMonto;
    updBilletera(b=>{
      const g=b.grupos.find(g=>g.id===grupoId);
      const it=g.items.find(i=>i.id===itemId);
      it.monto=monto;
      if(editConc.trim()) it.concepto=editConc.trim();
      it.nota=editNota.trim();
      return b;
    });
    if(diff!==0) setCaja(prev=>prev-diff); // más extracción = menos caja
    setEditItem(null);
    toast2("✏️ Item actualizado");
  };

  const deleteItem = (grupoId, itemId) => {
    const monto = billetera.grupos.find(g=>g.id===grupoId)?.items.find(i=>i.id===itemId)?.monto||0;
    updBilletera(b=>{ const g=b.grupos.find(g=>g.id===grupoId); g.items=g.items.filter(i=>i.id!==itemId); return b; });
    setCaja(prev=>prev+monto);
    toast2("🗑 Item eliminado · caja ajustada");
  };

  const addItem = (grupoId) => {
    const monto = Number(niMonto);
    if (!monto || !niConc.trim()) return;
    updBilletera(b=>{ b.grupos.find(g=>g.id===grupoId).items.push({id:uid(),concepto:niConc.trim(),monto,nota:niNota.trim()}); return b; });
    setCaja(prev=>prev-monto);
    setNewItem(null); setNiMonto(""); setNiConc(""); setNiNota("");
    toast2("💸 Item agregado · caja ajustada");
  };

  const addGrupo = () => {
    if(!ngNombre.trim()) return;
    updBilletera(b=>{ b.grupos.push({id:uid(),nombre:ngNombre.trim(),tipo:ngTipo,items:[]}); return b; });
    setNewGrupo(false); setNgNombre(""); setNgTipo("compartido");
  };

  const deleteGrupo = (grupoId) => {
    const g=billetera.grupos.find(g=>g.id===grupoId);
    const total=g.items.reduce((s,i)=>s+i.monto,0);
    updBilletera(b=>{ b.grupos=b.grupos.filter(g=>g.id!==grupoId); return b; });
    if(total) setCaja(prev=>prev+total);
    toast2("🗑 Grupo eliminado");
  };



  const saveInvertido = () => {
    const val=Number(invVal);
    if(!val&&val!==0) return;
    updBilletera(b=>{ b.invertido=val; return b; });
    setEditInv(false);
    toast2("✏️ Invertido actualizado");
  };

  const COLORS_GRUPO = ["#16a34a","#2563eb","#d97706","#7c3aed","#dc2626"];

  return (
    <div style={{borderRadius:14,marginBottom:10,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.12)"}}>

      {/* ── Header ── */}
      <div style={{background:"#1e1b4b",padding:"14px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.55)",fontWeight:700,letterSpacing:1,marginBottom:4}}>💼 BILLETERA</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.55)",marginBottom:2}}>Ganancias totales</div>
            <div style={{fontSize:24,fontWeight:900,color:"#a5f3fc",lineHeight:1}}>{F(gananciaTotal)}</div>
            <div style={{marginTop:6,display:"flex",gap:16}}>
              <div><div style={{fontSize:10,color:"rgba(255,255,255,0.45)"}}>Extraído total</div><div style={{fontWeight:800,color:"#fca5a5",fontSize:13}}>{F(totalExtraido)}</div></div>
              <div><div style={{fontSize:10,color:"rgba(255,255,255,0.45)"}}>Saldo ganancias</div><div style={{fontWeight:800,color:"#6ee7b7",fontSize:13}}>{F(gananciaTotal-totalExtraido)}</div></div>
            </div>
          </div>
          <button onClick={()=>setOpen(o=>!o)}
            style={{background:"rgba(165,243,252,0.15)",border:"1px solid rgba(165,243,252,0.3)",
              color:"#a5f3fc",borderRadius:8,padding:"7px 12px",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>
            {open?"Cerrar":"Ver todo"}
          </button>
        </div>
      </div>

      {open && (
        <div style={{background:"#f8fafc"}}>

          {/* ══ GRUPOS DE EXTRACCIÓN ══ */}
          {billetera.grupos.map((grupo, gi) => {
            const subtotal = grupo.items.reduce((s,i)=>s+i.monto,0);
            const color = COLORS_GRUPO[gi % COLORS_GRUPO.length];
            return (
              <div key={grupo.id}>
                {/* Items del grupo */}
                {grupo.items.map(item => {
                  const isEditing = editItem?.grupoId===grupo.id && editItem?.itemId===item.id;
                  return (
                    <div key={item.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      padding:"9px 16px",borderBottom:"1px solid #f1f5f9",background:"#fff"}}>
                      {isEditing ? (
                        <div style={{flex:1,display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                          <input placeholder="Concepto" value={editConc} onChange={e=>setEditConc(e.target.value)}
                            style={{flex:"1 1 120px",padding:"5px 8px",borderRadius:6,border:"1.5px solid #2563eb",fontSize:12,outline:"none"}}/>
                          <input type="number" placeholder="Monto" value={editVal} onChange={e=>setEditVal(e.target.value)}
                            style={{flex:"1 1 90px",padding:"5px 8px",borderRadius:6,border:"1.5px solid #2563eb",fontSize:12,outline:"none"}}/>
                          <input placeholder="Nota (opcional)" value={editNota} onChange={e=>setEditNota(e.target.value)}
                            style={{flex:"1 1 100%",padding:"5px 8px",borderRadius:6,border:"1.5px solid #93c5fd",fontSize:12,outline:"none"}}/>
                          <button onClick={()=>saveItem(grupo.id,item.id)}
                            style={{background:"#2563eb",color:"#fff",border:"none",borderRadius:6,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>✓ Guardar</button>
                          <button onClick={()=>setEditItem(null)}
                            style={{background:"#e5e7eb",color:"#374151",border:"none",borderRadius:6,padding:"5px 8px",fontSize:11,cursor:"pointer"}}>✕</button>
                        </div>
                      ) : (
                        <>
                          <div>
                            <span style={{fontSize:13,color:"#374151"}}>{item.concepto}</span>
                            {item.nota&&<div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>📝 {item.nota}</div>}
                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                            <span style={{fontWeight:700,color:"#374151",fontSize:13}}>{F(item.monto)}</span>
                            <button onClick={()=>{setEditItem({grupoId:grupo.id,itemId:item.id});setEditVal(String(item.monto));setEditConc(item.concepto);setEditNota(item.nota||"");}}
                              style={{background:"#eff6ff",border:"none",borderRadius:5,padding:"3px 7px",fontSize:10,color:"#2563eb",cursor:"pointer",fontWeight:700}}>✏️</button>
                            <button onClick={()=>deleteItem(grupo.id,item.id)}
                              style={{background:"#fee2e2",border:"none",borderRadius:5,padding:"3px 7px",fontSize:10,color:"#dc2626",cursor:"pointer",fontWeight:700}}>✕</button>
                          </div>
                        </>
                      )}
                    </div>
                  );
                })}

                {/* Agregar item */}
                {newItem===grupo.id ? (
                  <div style={{display:"flex",gap:6,padding:"8px 16px",background:"#f0f9ff",flexWrap:"wrap"}}>
                    <input placeholder="Concepto *" value={niConc} onChange={e=>setNiConc(e.target.value)}
                      style={{flex:"1 1 120px",padding:"6px 8px",borderRadius:6,border:"1.5px solid #0ea5e9",fontSize:12,outline:"none"}}/>
                    <input type="number" placeholder="Monto *" value={niMonto} onChange={e=>setNiMonto(e.target.value)}
                      style={{flex:"1 1 90px",padding:"6px 8px",borderRadius:6,border:"1.5px solid #0ea5e9",fontSize:12,outline:"none"}}/>
                    <input placeholder="📝 Nota (opcional)" value={niNota} onChange={e=>setNiNota(e.target.value)}
                      style={{flex:"1 1 100%",padding:"6px 8px",borderRadius:6,border:"1.5px solid #7dd3fc",fontSize:12,outline:"none"}}/>
                    <button onClick={()=>addItem(grupo.id)}
                      style={{background:"#0ea5e9",color:"#fff",border:"none",borderRadius:6,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Agregar</button>
                    <button onClick={()=>setNewItem(null)}
                      style={{background:"#e5e7eb",color:"#374151",border:"none",borderRadius:6,padding:"6px 8px",fontSize:12,cursor:"pointer"}}>✕</button>
                  </div>
                ) : null}

                {/* Subtotal del grupo — fila verde como Excel */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                  padding:"10px 16px",background:color+"18",borderLeft:`4px solid ${color}`}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontWeight:800,color:color,fontSize:13}}>Total {grupo.nombre}</span>
                    <button onClick={()=>setNewItem(newItem===grupo.id?null:grupo.id)}
                      style={{background:color+"22",border:`1px solid ${color}44`,borderRadius:5,padding:"2px 7px",fontSize:10,color:color,cursor:"pointer",fontWeight:700}}>+ Item</button>
                    <button onClick={()=>deleteGrupo(grupo.id)}
                      style={{background:"#fee2e2",border:"none",borderRadius:5,padding:"2px 6px",fontSize:10,color:"#dc2626",cursor:"pointer"}}>🗑</button>
                  </div>
                  <span style={{fontWeight:900,color:color,fontSize:15}}>{F(subtotal)}</span>
                </div>
              </div>
            );
          })}

          {/* Agregar grupo */}
          {newGrupo ? (
            <div style={{display:"flex",gap:8,padding:"10px 16px",background:"#fafafa",borderBottom:"1px solid #e5e7eb",flexWrap:"wrap"}}>
              <input placeholder="Nombre del grupo..." value={ngNombre} onChange={e=>setNgNombre(e.target.value)}
                style={{flex:"1 1 140px",padding:"7px 10px",borderRadius:6,border:"1.5px solid #7c3aed",fontSize:13,outline:"none"}}/>
              <select value={ngTipo} onChange={e=>setNgTipo(e.target.value)}
                style={{flex:"1 1 120px",padding:"7px 10px",borderRadius:6,border:"1.5px solid #7c3aed",fontSize:12,outline:"none",background:"#fff"}}>
                <option value="compartido">Gastos compartidos</option>
                <option value="marvin">Solo Marvin</option>
                <option value="paola">Solo Paola</option>
              </select>
              <button onClick={addGrupo}
                style={{background:"#7c3aed",color:"#fff",border:"none",borderRadius:6,padding:"7px 14px",fontSize:13,fontWeight:700,cursor:"pointer"}}>Crear</button>
              <button onClick={()=>setNewGrupo(false)}
                style={{background:"#e5e7eb",border:"none",borderRadius:6,padding:"7px 10px",fontSize:12,cursor:"pointer"}}>✕</button>
            </div>
          ) : (
            <button onClick={()=>setNewGrupo(true)}
              style={{width:"100%",padding:"9px",background:"#f8fafc",border:"none",borderTop:"1px solid #e5e7eb",
                color:"#7c3aed",fontWeight:700,fontSize:12,cursor:"pointer"}}>
              + Agregar grupo de extracción
            </button>
          )}

          {/* ══ RESUMEN GANANCIAS ══ */}
          <div style={{background:"#1e1b4b",padding:"12px 16px",marginTop:2}}>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.5)",fontWeight:700,letterSpacing:1,marginBottom:8}}>RESUMEN GANANCIAS</div>
            {[
              ["Ganancias (histórico + app)", gananciaTotal, "#a5f3fc"],
              ["Total (Ganancias + Invertido)", totalConInv, "#fbbf24"],
              ["Extraído Total", totalExtraido, "#fca5a5"],
            ].map(([lb,v,cl])=>(
              <div key={lb} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>
                <span style={{fontSize:12,color:"rgba(255,255,255,0.65)"}}>{lb}</span>
                <span style={{fontWeight:800,color:cl,fontSize:13}}>{F(v)}</span>
              </div>
            ))}
            {/* Editar ganancia histórica */}
            <div style={{marginTop:8,display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0"}}>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>· Ganancias pre-app</span>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>{F(billetera.gananciaHistorica)}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0"}}>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>· Ganancias desde app</span>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>{F(billetera.gananciaApp||0)}</span>
            </div>
          </div>

          {/* ══ SOCIOS ══ */}
          <div style={{background:"#fff",padding:"12px 16px",borderTop:"2px solid #e5e7eb"}}>
            <div style={{fontSize:11,color:"#6b7280",fontWeight:700,letterSpacing:1,marginBottom:8}}>SOCIOS / INVERSIÓN</div>

            {/* Invertido — editable */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #f1f5f9"}}>
              <span style={{fontSize:13,color:"#374151"}}>Invertido</span>
              {editInv ? (
                <div style={{display:"flex",gap:6}}>
                  <input type="number" value={invVal} onChange={e=>setInvVal(e.target.value)}
                    style={{width:110,padding:"4px 8px",borderRadius:6,border:"1.5px solid #2563eb",fontSize:12,outline:"none",textAlign:"right"}}/>
                  <button onClick={saveInvertido}
                    style={{background:"#2563eb",color:"#fff",border:"none",borderRadius:6,padding:"4px 8px",fontSize:11,fontWeight:700,cursor:"pointer"}}>✓</button>
                  <button onClick={()=>setEditInv(false)}
                    style={{background:"#e5e7eb",border:"none",borderRadius:6,padding:"4px 6px",fontSize:11,cursor:"pointer"}}>✕</button>
                </div>
              ) : (
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontWeight:700,fontSize:13}}>{F(billetera.invertido||0)}</span>
                  <button onClick={()=>{setEditInv(true);setInvVal(String(billetera.invertido||0));}}
                    style={{background:"#eff6ff",border:"none",borderRadius:5,padding:"3px 7px",fontSize:10,color:"#2563eb",cursor:"pointer",fontWeight:700}}>✏️</button>
                </div>
              )}
            </div>

            {/* ── Fórmula explicada ── */}
            <div style={{background:"#f0f9ff",borderRadius:8,padding:"8px 12px",margin:"8px 0",fontSize:11,color:"#0369a1",lineHeight:1.5}}>
              <b>Cálculo automático:</b><br/>
              Cada socio = (Ganancias ÷ 2) − Su extraído − (Gastos compartidos ÷ 2)
            </div>

            {/* ── Ganancias calculadas ── */}
            {[["Ganancias Marvin", gananciaMarvin, "#2563eb"],["Ganancias Paola", gananciaPoala, "#7c3aed"]].map(([lb,v,cl])=>(
              <div key={lb} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #f1f5f9"}}>
                <div>
                  <span style={{fontSize:13,color:"#374151",fontWeight:600}}>{lb}</span>
                  <div style={{fontSize:10,color:"#9ca3af",marginTop:1}}>Se actualiza automáticamente</div>
                </div>
                <span style={{fontWeight:800,fontSize:14,color:v>=0?cl:"#dc2626"}}>{F(v)}</span>
              </div>
            ))}

            {/* ══ TOTALES FINALES ══ */}
            <div style={{marginTop:10,borderTop:"2px solid #1e1b4b",paddingTop:10}}>
              {[
                ["Total",           totalGeneral,    "#1e1b4b", true ],
                ["Prestados",       totalPrestados,  "#2563eb", false],
                ["Efectivo (caja)", caja,            "#16a34a", false],
              ].map(([lb,v,cl,bold])=>(
                <div key={lb} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",
                  borderBottom:"1px solid #f1f5f9"}}>
                  <span style={{fontSize:13,fontWeight:bold?800:500,color:bold?"#1e1b4b":"#374151"}}>{lb}</span>
                  <span style={{fontWeight:800,fontSize:bold?15:13,color:cl}}>{F(v)}</span>
                </div>
              ))}
            </div>
          </div>

        </div>
      )}
    </div>
  );
}

// ─── CAJA CARD ───────────────────────────────────────────────────────────────
// El efectivo en caja se actualiza automáticamente con cada acción.
// El botón de ajuste sirve SOLO para corregir diferencias con la realidad
// (ej: billete que se olvidó registrar). Suma/resta sobre el valor actual.
function CajaCard({ caja, setCaja, toast2 }) {
  const [open, setOpen] = useState(false);
  const [modo, setModo] = useState("sumar"); // "sumar" | "restar"
  const [monto, setMonto] = useState("");

  const aplicar = () => {
    const val = Number(monto.replace(/\D/g,""));
    if (!val) return;
    const delta = modo === "sumar" ? val : -val;
    setCaja(prev => prev + delta);
    toast2((modo === "sumar" ? "💵 +" : "💵 -") + val.toLocaleString("es-CO") + " ajuste manual");
    setMonto(""); setOpen(false);
  };

  return (
    <div style={{background:"#f0fdf4", border:"2px solid #bbf7d0", borderRadius:14, padding:"14px 16px", marginBottom:10, boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom: open ? 12 : 0}}>
        <div>
          <div style={{fontSize:12, color:"#6b7280", fontWeight:600, marginBottom:2}}>💵 Efectivo en Caja</div>
          <div style={{fontSize:26, fontWeight:800, color:"#15803d"}}>{("$ " + Math.round(caja || 0).toLocaleString("es-CO"))}</div>
          <div style={{fontSize:10, color:"#16a34a", marginTop:2}}>Se actualiza automáticamente</div>
        </div>
        <button
          onClick={() => { setOpen(o => !o); setMonto(""); }}
          style={{background: open ? "#e5e7eb" : "#16a34a", color: open ? "#374151" : "#fff",
            border:"none", borderRadius:8, padding:"8px 12px", fontSize:12, fontWeight:700, cursor:"pointer"}}
        >
          {open ? "Cancelar" : "⚙️ Ajuste"}
        </button>
      </div>

      {open && (
        <div style={{borderTop:"1px solid #bbf7d0", paddingTop:12}}>
          <div style={{fontSize:12, color:"#6b7280", marginBottom:8}}>
            Usá esto solo si hay una diferencia con el efectivo real (ej: un ingreso o gasto que no pasó por la app).
          </div>
          <div style={{display:"flex", gap:8, marginBottom:8}}>
            {[["sumar","✅ Sumar","#16a34a"],["restar","❌ Restar","#dc2626"]].map(([v,lb,cl]) => (
              <button key={v} onClick={() => setModo(v)}
                style={{flex:1, padding:"8px", borderRadius:8, border:`2px solid ${modo===v ? cl : "#e5e7eb"}`,
                  background: modo===v ? cl+"15" : "#fff", color: modo===v ? cl : "#6b7280",
                  fontWeight:700, fontSize:13, cursor:"pointer"}}>
                {lb}
              </button>
            ))}
          </div>
          <div style={{display:"flex", gap:8}}>
            <input
              type="number"
              placeholder="Monto a ajustar..."
              value={monto}
              onChange={e => setMonto(e.target.value)}
              style={{flex:1, padding:"10px 12px", borderRadius:8, border:"1.5px solid #d1d5db",
                fontSize:14, outline:"none", boxSizing:"border-box"}}
            />
            <button onClick={aplicar}
              style={{background: modo==="sumar" ? "#16a34a" : "#dc2626", color:"#fff",
                border:"none", borderRadius:8, padding:"0 16px", fontWeight:700, fontSize:14, cursor:"pointer"}}>
              Aplicar
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── CALCULADORA RÁPIDA DE CUOTAS ────────────────────────────────────────────
function CalcRapida() {
  const [modId, setModId] = useState("");
  const mod = MODS.find(m => m.id === modId);

  return (
    <div style={{
      background: "#fffbeb",
      border: "2px solid #fbbf24",
      borderRadius: 14,
      padding: "14px 16px",
      marginBottom: 10,
      boxShadow: "0 1px 4px rgba(0,0,0,0.07)"
    }}>
      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <span style={{ fontSize: 22 }}>🧮</span>
        <div>
          <div style={{ fontWeight: 800, fontSize: 15, color: "#92400e" }}>Calculadora de Cuota</div>
          <div style={{ fontSize: 11, color: "#b45309" }}>Consulta rápida · igual que tu Excel</div>
        </div>
      </div>

      {/* Leyenda de convención */}
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
        {[[".S","Semanal","#2563eb"],[".Q","Quincenal","#7c3aed"],[".M","Mensual","#16a34a"]].map(([sf,lb,cl])=>(
          <div key={sf} style={{ background:"#fff", border:`1.5px solid ${cl}`, borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700, color:cl, display:"flex", gap:4, alignItems:"center" }}>
            <span style={{ fontFamily:"monospace" }}>{sf}</span>
            <span style={{ color:"#6b7280", fontWeight:400 }}>= {lb}</span>
          </div>
        ))}
      </div>

      {/* Selector agrupado por monto */}
      <select
        value={modId}
        onChange={e => setModId(e.target.value)}
        style={{
          width: "100%", padding: "11px 12px", borderRadius: 9,
          border: "2px solid #fbbf24", fontSize: 14, outline: "none",
          background: "#fff", fontWeight: 600, color: "#1f2937",
          boxSizing: "border-box", cursor: "pointer"
        }}
      >
        <option value="">Seleccioná una modalidad...</option>
        {MONTOS_UNICOS.map(monto => (
          <optgroup key={monto} label={`── $ ${(monto/1000).toLocaleString("es-CO")}.000 ──`}>
            {modsDeMontos(monto).map(m =>
              <option key={m.id} value={m.id}>{m.label}</option>
            )}
          </optgroup>
        ))}
      </select>

      {/* Resultado */}
      {mod ? (
        <div style={{ marginTop: 12 }}>
          {/* Cuota destacada */}
          <div style={{
            background: "#1d4ed8", borderRadius: 10,
            padding: "12px 16px", display: "flex",
            justifyContent: "space-between", alignItems: "center",
            marginBottom: 10
          }}>
            <div>
              <div style={{ color: "rgba(255,255,255,0.7)", fontSize: 11, fontWeight: 600, marginBottom: 2 }}>
                CUOTA ({mod.tipo === "semanal" ? "SEMANAL" : mod.tipo === "quincenal" ? "QUINCENAL" : "MENSUAL"})
              </div>
              <div style={{ color: "#fff", fontWeight: 900, fontSize: 28, letterSpacing: -0.5 }}>{fmt(mod.cuota)}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ color: "rgba(255,255,255,0.7)", fontSize: 11 }}>{mod.pagos} pago{mod.pagos !== 1 ? "s" : ""}</div>
              <div style={{ color: "#93c5fd", fontWeight: 800, fontSize: 14, marginTop: 2 }}>{mod.label}</div>
            </div>
          </div>

          {/* Detalle */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {[
              ["💵 Monto prestado",   fmt(mod.monto),           "#1d4ed8"],
              ["📊 Total a cobrar",   fmt(mod.cuota * mod.pagos),"#374151"],
              ["✅ Ganancia total",   fmt(mod.ganancia),         "#16a34a"],
              ["📈 Ganancia semanal", fmt(mod.semanal),          "#7c3aed"],
            ].map(([lb, v, cl]) => (
              <div key={lb} style={{ background: "#fff", borderRadius: 8, padding: "9px 11px", border: "1px solid #fde68a" }}>
                <div style={{ fontSize: 10, color: "#92400e", marginBottom: 3 }}>{lb}</div>
                <div style={{ fontWeight: 800, color: cl, fontSize: 13 }}>{v}</div>
              </div>
            ))}
          </div>
        </div>
      ) : (
        <div style={{
          marginTop: 10, padding: 14, background: "#fff",
          borderRadius: 8, border: "1px dashed #fbbf24",
          textAlign: "center", color: "#b45309", fontSize: 13
        }}>
          Seleccioná una modalidad para ver la cuota al instante
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
